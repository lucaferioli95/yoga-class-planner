<style>
/* Layout: library of drawn poses on the left, the class sequence on the right; on phones one pane at a time behind a bottom tab bar. */
:root {
  color-scheme: light;
  --bg: #F6EDE4; --surface: #FFFAF5; --surface2: #F1E4D8; --ink: #3B2A25; --ink2: #6B564E; --ink3: #8F7B72;
  --line: #E4D3C5; --line2: #D1BAA9;
  --accent: #A84A62; --accent-ink: #FFFFFF; --accent-soft: #F6DDE2; --accent-line: #E2AFBC;
  --warn: #86581C; --warn-soft: #F5E4C9; --danger: #A8342F; --danger-soft: #F7DDD9;
  --fig: #7A4A44; --fig-far: #D8B4A8; --ground: #E0CFC1;
  --c0: #B5586F; --c1: #8B5E3C; --c2: #C9954F; --c3: #D98A7A; --c4: #8E5B7A; --c5: #A39078;
  --scrim: rgba(46, 26, 20, .5);
  --font-d: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-b: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  --bg: #1F1614; --surface: #2A1E1B; --surface2: #241A17; --ink: #F3E7DF; --ink2: #C6B2A7; --ink3: #968278;
  --line: #3B2B27; --line2: #4D3A34;
  --accent: #E58AA3; --accent-ink: #2A1018; --accent-soft: #47262F; --accent-line: #6B3B49;
  --warn: #E4B069; --warn-soft: #3A2C17; --danger: #F08A80; --danger-soft: #452522;
  --fig: #E89AAE; --fig-far: #7A4A55; --ground: #43322D;
  --c0: #E58AA3; --c1: #C79A72; --c2: #E3B76A; --c3: #F0A090; --c4: #C08AAE; --c5: #B5A08C;
  --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1F1614; --surface: #2A1E1B; --surface2: #241A17; --ink: #F3E7DF; --ink2: #C6B2A7; --ink3: #968278;
  --line: #3B2B27; --line2: #4D3A34;
  --accent: #E58AA3; --accent-ink: #2A1018; --accent-soft: #47262F; --accent-line: #6B3B49;
  --warn: #E4B069; --warn-soft: #3A2C17; --danger: #F08A80; --danger-soft: #452522;
  --fig: #E89AAE; --fig-far: #7A4A55; --ground: #43322D;
  --c0: #E58AA3; --c1: #C79A72; --c2: #E3B76A; --c3: #F0A090; --c4: #C08AAE; --c5: #B5A08C;
  --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-b); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px; -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 30; }
body.lock { overflow: hidden; }
h1, h2, h3, h4 { font-family: var(--font-d); margin: 0; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.ic { flex: none; }
.app { max-width: 1280px; margin: 0 auto; }

/* header */
.top {
  position: static; z-index: 20; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0 10px; flex-wrap: wrap;
}
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; flex-wrap: wrap; }
.brand h1 { font-size: 21px; }
.ss { font-size: 12px; color: var(--ink3); }
.wip { font: 700 11px/1 var(--font-b); letter-spacing: .08em; padding: 4px 8px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); align-self: center; }
.ver { font-size: 11.5px; color: var(--ink3); align-self: center; }
.ss[data-state="error"] { color: var(--warn); }
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: flex; gap: 4px;
  padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  background: var(--surface); border-top: 1px solid var(--line);
}
.tabs button {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; min-height: 48px;
  background: none; border: 0; border-radius: 10px; font-size: 12px; color: var(--ink2); font-weight: 500;
}
.tabs button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
#tabBadge { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--ink2); min-height: 0; }
#tabBadge:empty { display: none; }

/* panes */
.panes { display: block; }
.app[data-view="lib"] .main { display: none; }
.app:not([data-view="lib"]) .lib { display: none; }
.app[data-view="saved"] #classView { display: none; }
.app:not([data-view="saved"]) #savedView { display: none; }

/* library */
.search { position: relative; display: block; }
.search .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink3); pointer-events: none; }
.search input {
  width: 100%; height: 44px; padding: 0 12px 0 38px; border: 1px solid var(--line2); border-radius: 12px; background: var(--surface);
}
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--line2); background: var(--surface); font-size: 13.5px; color: var(--ink);
}
.chip.sm { height: 32px; font-size: 13px; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.sw { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; }
.c0 { background: var(--c0); } .c1 { background: var(--c1); } .c2 { background: var(--c2); }
.c3 { background: var(--c3); } .c4 { background: var(--c4); } .c5 { background: var(--c5); }
.chip.on .sw { box-shadow: 0 0 0 1.5px var(--accent-ink); }
.filters { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-start; margin: 6px 0 0; font-size: 13.5px; color: var(--ink2); }
.filters label { display: flex; align-items: center; gap: 8px; min-height: 32px; }
.filters select { height: 34px; border: 1px solid var(--line2); border-radius: 8px; background: var(--surface); padding: 0 8px; }
.avoid { flex: 1 1 220px; }
.avoid summary { cursor: pointer; min-height: 32px; display: flex; align-items: center; }
.note { margin: 6px 0 0; font-size: 12.5px; color: var(--ink3); min-height: 0; }
.note:empty { display: none; }
.gh { display: flex; align-items: center; gap: 8px; font-size: 15px; margin: 18px 0 8px; }
.gh .ct { font-family: var(--font-b); font-weight: 400; font-size: 12.5px; color: var(--ink3); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 10px; }
.pc {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; min-width: 0;
}
.pc:hover { border-color: var(--line2); }
.pfig { position: relative; background: var(--surface2); border-radius: 9px; aspect-ratio: 4 / 3; overflow: hidden; }
svg { max-width: 100%; }
.pfig svg, .th svg, .dfig svg, .tc-fig svg { width: 100%; height: 100%; display: block; }
svg .near, svg .far { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: .15; }
svg .near { stroke: var(--fig); } svg .far { stroke: var(--fig-far); }
svg .gr { stroke: var(--ground); stroke-width: .06; stroke-linecap: round; }
svg .hd { fill: var(--fig); }
.th svg .near, .th svg .far { stroke-width: .26; } .th svg .gr { stroke-width: .12; }
.mirror svg { transform: scaleX(-1); }
.inc { position: absolute; top: 6px; left: 6px; font-size: 11px; background: var(--accent); color: var(--accent-ink); padding: 1px 7px; border-radius: 99px; font-weight: 600; }
.pt { display: flex; flex-direction: column; min-width: 0; padding: 0 2px; }
.pt b { font-family: var(--font-d); font-weight: 600; font-size: 14.5px; line-height: 1.2; }
.pt i { font-size: 12px; color: var(--ink2); }
.pf { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; margin-top: auto; }
.lv { display: inline-flex; gap: 3px; }
.lv i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--line2); }
.lv i.on { background: var(--ink2); border-color: var(--ink2); }
.add {
  width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid var(--accent); background: transparent; color: var(--accent);
}
.add:hover { background: var(--accent); color: var(--accent-ink); }
.empty-note { color: var(--ink2); padding: 24px 0; }

/* class view */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.head { display: grid; gap: 8px; }
#clsTitle {
  width: 100%; font-family: var(--font-d); font-weight: 600; font-size: 24px; letter-spacing: -.015em; padding: 4px 0; border: 0; border-bottom: 1.5px solid var(--line); background: transparent; border-radius: 0;
}
#clsTitle:focus { outline: none; border-color: var(--accent); }
.meta { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.meta input, .meta select, .fld input, textarea {
  width: 100%; height: 40px; padding: 0 10px; border: 1px solid var(--line2); border-radius: 10px; background: var(--surface2);
}
.meta select { width: auto; }
.summary { margin-top: 10px; }
.tot { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.big { font-family: var(--font-d); font-size: 34px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.of { color: var(--ink2); font-size: 14px; }
.cnt { color: var(--ink2); font-size: 14px; }
.meter { height: 8px; border-radius: 99px; background: var(--surface2); border: 1px solid var(--line); overflow: hidden; margin: 6px 0 10px; }
.meter span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.meter.over span { background: var(--warn); }
.meter.thin { height: 5px; margin: 6px 0; }
.mix { display: flex; height: 12px; gap: 2px; border-radius: 4px; overflow: hidden; }
.mix span { min-width: 4px; }
.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 8px 0 0; padding: 0; font-size: 12.5px; color: var(--ink2); }
.legend li { display: flex; align-items: center; gap: 6px; }
.legend b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.minor { font-size: 12.5px; color: var(--ink2); margin: 8px 0 0; }
.issues { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
.issues li { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; padding: 8px 10px; border-radius: 10px; background: var(--surface2); }
.issues li .ic { margin-top: 2px; }
.issues li span { flex: 1; min-width: 0; }
.issues li.warn { background: var(--warn-soft); color: var(--warn); }
.issues li.ok { color: var(--accent); background: var(--accent-soft); }
.issues li.info { color: var(--ink2); }
.mini {
  flex: none; height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid currentColor; background: transparent; font-size: 12.5px; font-weight: 600; color: inherit;
}
.items-head { display: flex; align-items: baseline; justify-content: space-between; margin: 18px 0 8px; }
.items-head h2 { font-size: 17px; }
#items { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.it { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.it.open { border-color: var(--accent-line); }
.row {
  width: 100%; display: grid; grid-template-columns: 20px 64px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left;
  padding: 8px 12px 8px 8px; background: none; border: 0; min-height: 60px;
}
.n { font-size: 12px; color: var(--ink3); text-align: center; font-variant-numeric: tabular-nums; }
.th { width: 64px; height: 48px; background: var(--surface2); border-radius: 8px; overflow: hidden; display: block; }
.cust { display: grid; place-items: center; height: 100%; color: var(--ink2); }
.cust.big { height: 140px; }
.tx { display: flex; flex-direction: column; min-width: 0; }
.tx b { font-family: var(--font-d); font-weight: 600; font-size: 15.5px; line-height: 1.2; overflow-wrap: anywhere; }
.sub { font-size: 12.5px; color: var(--ink2); }
.nt { font-size: 12.5px; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tm { display: flex; flex-direction: column; align-items: flex-end; font-variant-numeric: tabular-nums; }
.tm b { font-size: 16px; font-weight: 600; }
.tm span { font-size: 11.5px; color: var(--ink3); }
.ctl { padding: 4px 12px 12px; display: grid; gap: 10px; border-top: 1px dashed var(--line); }
.ctl-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ctl-row.acts { gap: 4px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line2); border-radius: 12px; overflow: hidden; background: var(--surface2); }
.stepper button { width: 46px; height: 44px; display: grid; place-items: center; border: 0; background: none; color: var(--accent); }
.stepper button:active { background: var(--accent-soft); }
.stepper output { min-width: 96px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.stepper small { font-weight: 400; color: var(--ink2); font-size: 11.5px; }
.tog { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; }
.tog input { width: 20px; height: 20px; accent-color: var(--accent); }
.fld { display: grid; gap: 4px; font-size: 12.5px; color: var(--ink2); }
.ib {
  width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; border: 1px solid transparent; background: none; color: var(--ink2);
}
.ib:hover:not(:disabled) { background: var(--surface2); color: var(--ink); }
.ib:disabled { opacity: .35; cursor: default; }
.ib.danger { color: var(--danger); }
.ctl .mini { color: var(--accent); margin-left: auto; }
.sec { display: flex; align-items: center; gap: 2px; padding: 12px 0 2px; }
.sec-in {
  flex: 1; min-width: 0; font-family: var(--font-d); font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2);
  background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 6px 0; height: 36px; border-radius: 0;
}
.sec-in:focus { outline: none; border-color: var(--accent); color: var(--ink); }
.subt { font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; padding: 0 6px; }
.sec .ib { width: 34px; height: 34px; }
.empty { text-align: center; padding: 28px 16px; background: var(--surface); border: 1px dashed var(--line2); border-radius: 16px; }
.empty b { font-family: var(--font-d); font-size: 18px; }
.empty p { color: var(--ink2); margin: 4px 0 14px; }
.row-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line2);
  background: var(--surface); font-weight: 600; font-size: 14.5px;
}
.btn:hover { border-color: var(--ink3); }
.btn.sm { height: 36px; padding: 0 12px; font-size: 13.5px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.add-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.add-row .btn { height: 38px; font-size: 13.5px; font-weight: 500; border-style: dashed; background: transparent; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }

/* saved */
.sv-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 12px; }
.sv-head h2 { font-size: 20px; }
#savedList { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.sc { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.sc.cur { border-color: var(--accent-line); }
.sc-main { display: flex; flex-direction: column; min-width: 0; flex: 1 1 200px; }
.sc-main b { font-family: var(--font-d); font-size: 16.5px; overflow-wrap: anywhere; }
.sc-main span { font-size: 13px; color: var(--ink2); }
.sc-main .fo { color: var(--accent); }
.sc-act { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.cf { font-size: 13px; color: var(--danger); margin-right: 4px; }

/* sheets */
#sheet {
  position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  position: relative; width: 100%; max-width: 560px; max-height: 90dvh; overflow-y: auto; background: var(--surface); color: var(--ink);
  border-radius: 20px 20px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
}
.sheet h2 { font-size: 24px; padding-right: 44px; }
.sheet h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); margin: 16px 0 6px; font-family: var(--font-b); font-weight: 600; }
.sheet p { margin: 8px 0; }
.sk { color: var(--ink2); font-style: italic; margin: 0 !important; }
.x { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 0; background: var(--surface2); color: var(--ink); }
.dfig { background: var(--surface2); border-radius: 14px; aspect-ratio: 4 / 3; overflow: hidden; margin: 24px 0 14px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.tag.soft { background: var(--surface2); color: var(--ink2); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.cues { margin: 0; padding-left: 20px; }
.cues li { margin: 3px 0; }
.sheet-act { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.tpls { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; }
.tpl { width: 100%; text-align: left; display: grid; gap: 2px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line2); background: var(--surface); }
.tpl:hover { border-color: var(--accent); }
.tpl b { font-family: var(--font-d); font-size: 17px; }
.tpl span { color: var(--ink2); font-size: 13.5px; }
.tpl em { color: var(--accent); font-style: normal; font-size: 13px; }
.tpl.blank { border-style: dashed; }
#planTxt { height: auto; width: 100%; padding: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.5; margin-top: 12px; resize: vertical; white-space: pre; overflow: auto; }

/* toast */
#toast {
  position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); z-index: 50; opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 12px; display: flex; gap: 12px; align-items: center; font-size: 14px; max-width: calc(100vw - 32px);

<script>
const YogaFig = (() => {
  const D = Math.PI / 180;
  const LEN = { ua: .62, fa: .53, th: .82, sh: .78, ft: .26, nk: .1, hr: .2 };
  const dir = a => [Math.cos(a * D), Math.sin(a * D)];
  const pt = (p, a, l) => { const d = dir(a); return [p[0] + d[0] * l, p[1] + d[1] * l]; };
  const DEF = { t: -90, t2: null, h: -90, a: [[90, 90], [90, 90]], l: [[90, 90, 0], [90, 90, 0]] };
  const SIDES = ['N', 'F'];

  function solve(src) {
    const P = Object.assign({}, DEF, src);
    const t2 = P.t2 == null ? P.t : P.t2;
    const a = P.a.map(x => x.slice());
    const l = P.l.map(x => x.slice());
    const J = {};
    const compute = () => {
      J.hip = [0, 0];
      const mid = pt(J.hip, P.t, .5);
      J.mid = mid;
      J.sh = pt(mid, t2, .42);
      J.neck = pt(mid, t2, .5);
      J.head = pt(J.neck, P.h, LEN.nk + LEN.hr);
      SIDES.forEach((s, i) => {
        const el = pt(J.sh, a[i][0], LEN.ua);
        J['el' + s] = el;
        J['wr' + s] = pt(el, a[i][1], LEN.fa);
        const kn = pt(J.hip, l[i][0], LEN.th);
        const an = pt(kn, l[i][1], LEN.sh);
        J['kn' + s] = kn;
        J['an' + s] = an;
        J['to' + s] = pt(an, l[i][2], LEN.ft);
      });
    };
    compute();
    let F = null;
    if (typeof P.ref === 'number') F = P.ref;
    else if (P.ref) F = J[P.ref][1];

    const slot = name => {
      const k = name.slice(0, 2), i = name.endsWith('F') ? 1 : 0;
      if (k === 'kn') return [l, i, 0];
      if (k === 'an' || k === 'to') return [l, i, 1];
      if (k === 'el') return [a, i, 0];
      return [a, i, 1];
    };
    const adiff = (x, y) => { let d = Math.abs(x - y) % 360; return d > 180 ? 360 - d : d; };
    const snap = name => {
      if (F == null) return;
      const [arr, i, k] = slot(name);
      const given = arr[i][k];
      let best = null, bestErr = 1e9;
      for (let ang = 0; ang < 360; ang += .5) {
        arr[i][k] = ang; compute();
        const err = Math.abs(J[name][1] - F);
        const score = err < .012 ? adiff(ang, given) * .001 : 10 + err;
        if (score < bestErr) { bestErr = score; best = ang; }
      }
      arr[i][k] = best; compute();
    };
    const order = { kn: 0, el: 1, an: 2, to: 2, wr: 3 };
    const snaps = (P.snap || []).slice().sort((x, y) => order[x.slice(0, 2)] - order[y.slice(0, 2)]);
    snaps.filter(n => order[n.slice(0, 2)] < 2).forEach(snap);

    const ik = (name, target, bend) => {
      const isArm = name.startsWith('wr');
      const i = name.endsWith('F') ? 1 : 0;
      const root = isArm ? J.sh : J.hip;
      const L1 = isArm ? LEN.ua : LEN.th, L2 = isArm ? LEN.fa : LEN.sh;
      const dx = target[0] - root[0], dy = target[1] - root[1];
      let d = Math.hypot(dx, dy);
      d = Math.max(Math.abs(L1 - L2) + .01, Math.min(L1 + L2 - .002, d));
      const base = Math.atan2(dy, dx) / D;
      const A = Math.acos(Math.max(-1, Math.min(1, (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d)))) / D;
      const a1 = base + bend * A;
      const el = pt(root, a1, L1);
      const a2 = Math.atan2(target[1] - el[1], target[0] - el[0]) / D;
      if (isArm) { a[i][0] = a1; a[i][1] = a2; } else { l[i][0] = a1; l[i][1] = a2; }
      compute();
    };
    if (P.ik) Object.keys(P.ik).forEach(n => { const r = P.ik[n](J, F); ik(n, r[0], r[1]); });
    snaps.filter(n => order[n.slice(0, 2)] >= 2).forEach(snap);

    return { J, F, P, t2 };
  }

  const W = 5.6, H = 4.4;
  const f = n => Math.round(n * 1000) / 1000;
  const poly = pts => pts.map(p => f(p[0]) + ',' + f(p[1])).join(' ');

  function svg(shape, o) {
    o = o || {};
    const { J, F, P } = solve(shape);
    const pts = Object.keys(J).filter(k => k !== 'mid').map(k => J[k]);
    let minx = Math.min(...pts.map(p => p[0])) - .25, maxx = Math.max(...pts.map(p => p[0])) + .25;
    const maxy = Math.max(...pts.map(p => p[1]));
    const miny = Math.min(...pts.map(p => p[1])) - .25;
    const floorY = (F == null ? maxy : F) + .07;
    if (P.wall != null) maxx = Math.max(maxx, P.wall + .2);
    const bw = maxx - minx + .6, bh = floorY + .12 - miny + .5;
    const vw = Math.max(bw, bh * (W / H), 3.6), vh = vw * (H / W);
    const x0 = (minx + maxx) / 2 - vw / 2, y0 = (miny + floorY + .12) / 2 - vh / 2;
    const g = [];
    const limb = (cls, pp) => `<polyline class="${cls}" points="${poly(pp)}"/>`;
    const armP = s => [J.sh, J['el' + s], J['wr' + s]];
    const legP = s => [J.hip, J['kn' + s], J['an' + s], J['to' + s]];
    g.push(limb('far', armP('F')), limb('far', legP('F')));
    g.push(limb('near', [J.hip, J.mid, J.neck]));
    g.push(limb('near', legP('N')), limb('near', armP('N')));
    const ground = `<line class="gr" x1="${f(minx - .15)}" y1="${f(floorY)}" x2="${f(maxx + .15)}" y2="${f(floorY)}"/>`;
    const wall = P.wall != null ? `<line class="gr" x1="${f(P.wall)}" y1="${f(floorY)}" x2="${f(P.wall)}" y2="${f(y0 + .2)}"/>` : '';
    const head = `<circle class="hd" cx="${f(J.head[0])}" cy="${f(J.head[1])}" r=".2"/>`;
    const cls = o.cls ? ` class="${o.cls}"` : '';
    return `<svg${cls} viewBox="${f(x0)} ${f(y0)} ${f(vw)} ${f(vh)}" role="img" aria-label="${o.label || 'Yoga pose figure'}" xmlns="http://www.w3.org/2000/svg">` +
      `<g class="fg">${ground}${wall}${g.join('')}${head}</g></svg>`;
  }

  return { solve, svg };
})();

  }

    const others = Array.from($('#items').children).filter(li => li.dataset.u && li !== D.li);
    others.forEach(li => li.classList.remove('dt-before', 'dt-after'));
    let to = 0;
    others.forEach(li => { const r = li.getBoundingClientRect(); if (r.top + r.height / 2 < D.y) to++; });
    D.to = to;
    if (others.length) { if (to < others.length) others[to].classList.add('dt-before'); else others[others.length - 1].classList.add('dt-after'); }
  }
  function dragLoop() {
    if (!D) return;

  function planText(c) {
    const lines = [c.title || 'Untitled class'];
    if (c.focus) lines.push('Focus: ' + c.focus);
    const poses = c.items.filter(i => i.k === 'pose').length;
    lines.push('Planned ' + fmt(total(c)) + ' of ' + c.target + ' min target · ' + poses + ' poses', '');
    let t = 0;
    c.items.forEach(it => {
      if (it.k === 'section') { lines.push('', '== ' + it.t + ' =='); return; }
      const p = it.k === 'pose' ? POSE[it.p] : null;
      const name = p ? p.name + ' (' + p.sk + ')' : (it.t || 'Custom step');
      lines.push(fmt(t).padStart(5) + '  ' + name + ' · ' + fmt(it.s) + (it.b ? ' each side' : ''));
      if (it.n) lines.push('       ' + it.n);

    return lines.join('\n').replace(/\n{3,}/g, '\n\n');
  }
  /* ---------- PDF export ---------- */
  const latin = s => String(s == null ? '' : s).replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-').replace(/[^\x20-\xff]/g, '');
  const FIG_CSS = '.near{fill:none;stroke:#1f6f5c;stroke-width:.15;stroke-linecap:round;stroke-linejoin:round}' +
    '.far{fill:none;stroke:#8fbfb2;stroke-width:.15;stroke-linecap:round;stroke-linejoin:round}' +
    '.gr{stroke:#c9cfc8;stroke-width:.06;stroke-linecap:round}.hd{fill:#1f6f5c}';
  function rasterFig(id) {
    return new Promise(res => {
      try {
        const svg = fig(id).replace('<svg', '<svg width="300" height="236"').replace('>', '><style>' + FIG_CSS + '</style>');
        const img = new Image();
        img.onload = () => {
          try {
            const cv = document.createElement('canvas'); cv.width = 300; cv.height = 236;
            const g = cv.getContext('2d'); g.fillStyle = '#f4f6f3'; g.fillRect(0, 0, 300, 236); g.drawImage(img, 0, 0, 300, 236);
            res(cv.toDataURL('image/jpeg', .9));
          } catch (e) { res(null); }
        };
        img.onerror = () => res(null);
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      } catch (e) { res(null); }
    });
  }
  async function buildPdf(c) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const W = 210, H = 297, M = 16, TX = M + 32;
    const ids = Array.from(new Set(c.items.filter(i => i.k === 'pose').map(i => i.p)));
    const imgs = {};
    await Promise.all(ids.map(async id => { imgs[id] = await rasterFig(id); }));
    let y = M;
    const need = h => { if (y + h > H - 16) { doc.addPage(); y = M; } };
    const wrap = (s, w) => doc.splitTextToSize(latin(s), w);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(20); doc.setTextColor(59, 42, 37);
    const tl = wrap(c.title || 'Untitled class', W - 2 * M);
    doc.text(tl, M, y + 6); y += 6 + (tl.length - 1) * 8;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(95, 107, 110);
    const npose = c.items.filter(i => i.k === 'pose').length;
    const meta = [c.focus ? 'Focus: ' + c.focus : '', fmt(total(c)) + ' planned of ' + c.target + ' min', npose + ' poses'].filter(Boolean).join('   |   ');
    y += 6; doc.text(wrap(meta, W - 2 * M), M, y); y += 8;
    let t = 0;
    c.items.forEach(it => {
      if (it.k === 'section') {
        need(22); y += 3;
        doc.setFillColor(168, 74, 98); doc.rect(M, y, W - 2 * M, 7, 'F');
        doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(255, 255, 255);
        doc.text(latin(it.t || 'Section').toUpperCase(), M + 3, y + 4.8); y += 10; return;
      }
      const p = it.k === 'pose' ? POSE[it.p] : null;
      const hold = fmt(it.s) + (it.b ? ' each side (' + fmt(itemSecs(it)) + ' total)' : '');
      const cues = p ? p.cues.slice(0, 2).map(q => wrap('- ' + q, W - M - TX)).flat() : [];
      const note = it.n ? wrap('Note: ' + it.n, W - M - TX) : [];
      const h = Math.max(p ? 24 : 12, 13 + cues.length * 4 + note.length * 4.2);
      need(h + 2);
      doc.setDrawColor(215, 221, 217); doc.setLineWidth(.2); doc.line(M, y + h, W - M, y + h);
      if (p && imgs[it.p]) doc.addImage(imgs[it.p], 'JPEG', M + 8, y + 1, 24, 18.9, it.p);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(120, 130, 132);
      doc.text(fmt(t), M, y + 5);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(11.5); doc.setTextColor(59, 42, 37);
      doc.text(latin(p ? p.name : (it.t || 'Custom step')), p ? TX + 4 : M + 8, y + 5);
      const x0 = p ? TX + 4 : M + 8;
      let yy = y + 5;
      if (p) { doc.setFont('helvetica', 'italic'); doc.setFontSize(9); doc.setTextColor(95, 107, 110); yy += 4.5; doc.text(latin(p.sk), x0, yy); }
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(168, 74, 98); yy += 4.6; doc.text(latin(hold), x0, yy);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(80, 92, 95);
      cues.forEach(l => { yy += 4; doc.text(l, x0, yy); });
      doc.setFont('helvetica', 'italic'); doc.setTextColor(59, 42, 37);
      note.forEach(l => { yy += 4.2; doc.text(l, x0, yy); });
      y += h + 2; t += itemSecs(it);
    });
    const load = {};
    c.items.forEach(it => { if (it.k === 'pose') POSE[it.p].avoid.forEach(a => { (load[a] = load[a] || []).push(POSE[it.p].name); }); });
    const keys = Object.keys(load);
    if (keys.length) {
      need(20); y += 4;
      doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(59, 42, 37); doc.text('Offer options for students with', M, y); y += 5;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(80, 92, 95);
      keys.sort((a, b) => load[b].length - load[a].length).forEach(k => {
        const names = Array.from(new Set(load[k]));
        const ls = wrap(k.charAt(0).toUpperCase() + k.slice(1) + ': ' + names.join(', '), W - 2 * M);
        need(ls.length * 4 + 1); doc.text(ls, M, y); y += ls.length * 4 + 1;
      });
    }
    const n = doc.getNumberOfPages();
    for (let i = 1; i <= n; i++) {
      doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(140, 148, 150);
      doc.text(latin(c.title || 'Class') + '  -  page ' + i + ' of ' + n, W / 2, H - 8, { align: 'center' });
    }
    return doc.output('blob');
  }

    if (!T) return; const el = $('#teach');
    if (T.done) {
      el.innerHTML = '<div class="tc"><div class="tc-top"><button class="btn ghost" data-act="tclose">Close</button></div><div class="tc-done"><h2>Class complete</h2><p>' + esc(cur().title || 'Untitled class') + ' · ' + fmt(total(cur())) + '</p><button class="btn primary" data-act="trestart">Run again</button></div></div>';
      return;
    }
    const s = T.steps[T.i], nx = T.steps[T.i + 1];
    const pct = (T.i / T.steps.length) * 100;
    el.innerHTML = '<div class="tc"><div class="tc-top"><button class="btn ghost" data-act="tclose">' + ic('x', 16) + ' Close</button>' +
      '<span class="tc-pos">Step ' + (T.i + 1) + ' of ' + T.steps.length + '</span><span class="tc-rem" id="tRem">' + fmt(remainingAll()) + ' left</span></div>' +
      '<div class="meter thin"><span style="width:' + pct + '%"></span></div>' +
      (s.sec ? '<p class="tc-sec">' + esc(s.sec) + '</p>' : '') +
      '<div class="tc-fig' + (s.side === 2 ? ' mirror' : '') + '">' + (s.id ? fig(s.id) : '<div class="cust big">' + ic('text', 56) + '</div>') + '</div>' +
      '<h2 class="tc-name">' + esc(s.label) + '</h2>' +
      '<p class="tc-sub">' + esc(s.sk) + (s.side ? '<span class="side">Side ' + s.side + ' of 2</span>' : '') + '</p>' +
      (s.cues.length ? '<ul class="tc-cues">' + s.cues.map(c => '<li>' + esc(c) + '</li>').join('') + '</ul>' : '') +
      (s.note ? '<p class="tc-note">' + esc(s.note) + '</p>' : '') +
      '<div class="tc-time" id="tTime" aria-live="off">' + fmt(T.left) + '</div>' +
      '<div class="meter thin step"><span id="tBar" style="width:' + ((s.secs - T.left) / s.secs * 100) + '%"></span></div>' +
      '<div class="tc-ctl"><button class="rb" data-act="tprev" aria-label="Previous step">' + ic('back', 22) + '</button>' +
      '<button class="rb big" data-act="tplay" aria-label="' + (T.running ? 'Pause' : 'Start') + '">' + ic(T.running ? 'pause' : 'play', 28) + '</button>' +
      '<button class="rb" data-act="tnext" aria-label="Next step">' + ic('fwd', 22) + '</button></div>' +
      '<p class="tc-next">' + (nx ? 'Next: <b>' + esc(nx.label) + '</b>' + (nx.side ? ' (side ' + nx.side + ')' : '') + ' · ' + fmt(nx.secs) : 'Last step') + '</p></div>';
  }
  function tGo(i) {
    if (!T) return;
    if (i >= T.steps.length) { T.done = true; T.running = false; clearInterval(T.timer); T.timer = null; renderTeach(); return; }
    T.i = Math.max(0, i); T.left = T.steps[T.i].secs; T.endAt = Date.now() + T.left * 1000; renderTeach();
  }
  function tTick() {
    if (!T || !T.running) return;
    T.left = Math.max(0, Math.ceil((T.endAt - Date.now()) / 1000));
    const tt = $('#tTime'); if (tt) tt.textContent = fmt(T.left);
    const bar = $('#tBar'); const s = T.steps[T.i]; if (bar) bar.style.width = ((s.secs - T.left) / s.secs * 100) + '%';
    const rem = $('#tRem'); if (rem) rem.textContent = fmt(remainingAll()) + ' left';
    if (T.left <= 0) tGo(T.i + 1);
  }
  function tPlay() {
    if (!T) return;
    T.running = !T.running;
    if (T.running) { T.endAt = Date.now() + T.left * 1000; if (!T.timer) T.timer = setInterval(tTick, 250); }
    renderTeach();
  }

  /* ---------- actions ---------- */
  function move(u, dir) {
    const c = cur(); const i = c.items.findIndex(x => x.u === u); const j = i + dir;
    if (i < 0 || j < 0 || j >= c.items.length) return;
    const t = c.items[i]; c.items[i] = c.items[j]; c.items[j] = t;
    touch(); renderClass();
  }
  function stepFor(s, dir) {
    const d = dir < 0 ? (s <= 120 ? 15 : s <= 600 ? 30 : 60) : (s < 120 ? 15 : s < 600 ? 30 : 60);
    return Math.max(10, Math.min(1800, s + dir * d));
  }
  function newClass(c) {
    S.classes.push(c); S.curId = c.id; S.open = null; saveUi(); saveLocal(); queuePush(c);
    setView('class'); renderAll(); window.scrollTo({ top: 0 });
  }

  function onClick(e) {
    const t = e.target.closest('[data-act]'); if (!t) {
      if (e.target.id === 'sheet') closeSheet();
      return;
    }
    const act = t.dataset.act, u = t.dataset.u, id = t.dataset.id, c = cur();
    const item = u ? c.items.find(x => x.u === u) : null;
    switch (act) {
      case 'detail': if (!e.target.closest('.add')) openDetail(id); break;
      case 'add': addPose(id); break;
      case 'add-close': addPose(id); closeSheet(); break;
      case 'add-counter': addPose(id, null, true); addPose(counterFor(id), null, true); closeSheet(); toast('Added ' + POSE[id].name + ' and ' + POSE[counterFor(id)].name); break;
      case 'info': openDetail(id); break;
      case 'pose-edit': openEditPose(id); break;
      case 'pose-cancel': openDetail(id); break;
      case 'pose-save': savePose(id); break;
      case 'pose-reset': resetPose(id); break;
      case 'close': closeSheet(); break;
      case 'cat': S.cat = t.dataset.v; renderLib(); break;
      case 'avoid': { const v = t.dataset.v; S.avoid = S.avoid.includes(v) ? S.avoid.filter(x => x !== v) : S.avoid.concat(v); saveUi(); renderLib(); break; }
      case 'toggle': S.open = S.open === u ? null : u; renderClass(); break;
      case 'inc': item.s = stepFor(item.s, 1); touch(); renderClass(); refocus(u, 'inc'); break;
      case 'dec': item.s = stepFor(item.s, -1); touch(); renderClass(); refocus(u, 'dec'); break;
      case 'up': move(u, -1); refocus(u, 'up'); break;
      case 'down': move(u, 1); refocus(u, 'down'); break;
      case 'dup': { const i = c.items.indexOf(item); const cp = Object.assign({}, item, { u: uid() }); c.items.splice(i + 1, 0, cp); S.open = cp.u; touch(); renderClass(); renderLib(); renderTabs(); break; }
      case 'del': {
        const i = c.items.indexOf(item); c.items.splice(i, 1); if (S.open === u) S.open = null;
        S.lastRemoved = { item, i, cid: c.id }; touch(); renderClass(); renderLib(); renderTabs();
        toast('Removed ' + (item.k === 'pose' ? POSE[item.p].name : item.k === 'section' ? 'section' : 'step'), 'Undo', () => {
          const r = S.lastRemoved; const cc = S.classes.find(x => x.id === r.cid); if (!cc) return;
          cc.items.splice(Math.min(r.i, cc.items.length), 0, r.item); S.lastRemoved = null; touch(); renderClass(); renderLib(); renderTabs();
        }); break;
      }
      case 'toast-act': if (toast.fn) toast.fn(); $('#toast').classList.remove('show'); break;
      case 'fix': {
        const f = t.dataset.fix;
        if (f === 'rest') addPose('corpse', null, true);
        else if (f === 'counter') addPose(counterFor(item.p), u, true);
        else if (f === 'both') { item.b = true; touch(); renderClass(); renderTabs(); }
        break;
      }
      case 'add-section': { const it = { u: uid(), k: 'section', t: 'New section', s: 0, b: false, n: '' }; c.items.push(it); touch(); renderClass(); const inp = document.querySelector('[data-u="' + it.u + '"] .sec-in'); if (inp) { inp.focus(); inp.select(); } break; }
      case 'add-step': { const it = { u: uid(), k: 'custom', t: 'Breathwork', s: 120, b: false, n: '' }; c.items.push(it); S.open = it.u; touch(); renderClass(); renderTabs(); break; }
      case 'templates': openTemplates(); break;
      case 'tpl': { closeSheet(); const tp = TEMPLATES.find(x => x.id === id); newClass(tp ? fromTemplate(tp) : blankClass('Untitled class')); break; }
      case 'new': openTemplates(); break;
      case 'export': openExport(); break;
      case 'copy-plan': {
        const ta = $('#planTxt'); const msg = $('#exportMsg');
        const fallback = () => { ta.focus(); ta.select(); try { document.execCommand('copy'); msg.textContent = 'Copied.'; } catch (er) { msg.textContent = 'Select the text and copy it.'; } };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(() => { msg.textContent = 'Copied.'; }).catch(fallback); else fallback();
        break;
      }
      case 'save-plan': {
        const msg = $('#exportMsg'); const name = ((c.title || 'class').replace(/[^\w\- ]+/g, '').trim() || 'class') + '.txt';
        saveFile(name, $('#planTxt').value, 'text/plain').then(() => { msg.textContent = 'Saved.'; }).catch(er => { msg.textContent = er && er.code === 'declined' ? 'Save cancelled.' : 'Saving is not available here. Use Copy text.'; });
        break;
      }
      case 'save-pdf': {
        const msg = $('#exportMsg'); const name = ((c.title || 'class').replace(/[^\w\- ]+/g, '').trim() || 'class') + '.pdf';
        msg.textContent = 'Building the PDF…';
        buildPdf(c).then(blob => saveFile(name, blob))
          .then(() => { msg.textContent = 'Saved.'; })
          .catch(er => { msg.textContent = er && er.code === 'declined' ? 'Save cancelled.' : 'Couldn\'t save the PDF here. Use Copy text instead.'; });
        break;
      }
      case 'teach': openTeach(); break;
      case 'tclose': closeTeach(); break;
      case 'tplay': tPlay(); break;
      case 'tnext': tGo(T.i + 1); break;
      case 'tprev': tGo(T.i - 1); break;
      case 'trestart': T.done = false; tGo(0); break;
      case 'goto': setView(t.dataset.v); renderTabs(); window.scrollTo({ top: 0 }); break;
      case 'open-class': S.curId = id; S.open = null; saveUi(); setView('class'); renderAll(); window.scrollTo({ top: 0 }); break;
      case 'dup-class': { const src = S.classes.find(x => x.id === id); const cp = JSON.parse(JSON.stringify(src)); cp.id = 'c-' + uid() + uid(); cp.title = (src.title || 'Untitled class') + ' (copy)'; cp.items.forEach(i => { i.u = uid(); }); cp.created = cp.updated = Date.now(); newClass(cp); toast('Duplicated'); break; }
      case 'del-ask': S.confirmDel = id; renderSaved(); break;
      case 'del-no': S.confirmDel = null; renderSaved(); break;
      case 'del-yes': {
        S.classes = S.classes.filter(x => x.id !== id); S.confirmDel = null;
        if (cloud.coll) { cloud.coll.doc(id).delete().catch(() => { }); }
        if (!S.classes.length) S.classes.push(blankClass('Untitled class'));
        if (S.curId === id) { S.curId = S.classes[0].id; S.open = null; }
        saveLocal(); saveUi(); renderAll(); toast('Class deleted'); break;
      }
      default: break;
    }
  }
  function refocus(u, act) { const b = document.querySelector('[data-u="' + u + '"][data-act="' + act + '"]'); if (b && !b.disabled) b.focus(); }

  function onInput(e) {
    const t = e.target, act = t.dataset && t.dataset.act, c = cur();
    if (t.id === 'clsTitle') { c.title = t.value; touch(); const o = $('#clsSwitch option:checked'); if (o) o.textContent = t.value || 'Untitled class'; return; }
    if (t.id === 'clsFocus') { c.focus = t.value; touch(); return; }
    if (t.id === 'search') { S.q = t.value.trim(); renderLib(); return; }
    if (!act) return;
    const item = c.items.find(x => x.u === t.dataset.u);
    if (act === 'note' && item) { item.n = t.value; touch(); }
    else if (act === 'label' && item) { item.t = t.value; touch(); }
    else if (act === 'sec' && item) { item.t = t.value; touch(); }
  }
  function onChange(e) {
    const t = e.target, act = t.dataset && t.dataset.act, c = cur();
    if (t.id === 'clsSwitch') { S.curId = t.value; S.open = null; saveUi(); renderAll(); window.scrollTo({ top: 0 }); return; }
    if (t.id === 'clsTarget') { c.target = +t.value; touch(); renderClass(); return; }
    if (t.id === 'lvlSel') { S.lvl = +t.value; saveUi(); renderLib(); return; }
    if (!act) return;
    const item = c.items.find(x => x.u === t.dataset.u);
    if (act === 'both' && item) { item.b = t.checked; touch(); renderClass(); renderTabs(); }
    else if (act === 'note' || act === 'label' || act === 'sec') { renderClass(); }
  }

  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (!$('#sheet').hidden) closeSheet(); else if (T) closeTeach(); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('pc')) { e.preventDefault(); openDetail(e.target.dataset.id); }
    if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('sec-in')) e.target.blur();
  });
  $$('#tabs [data-view]').forEach(b => b.addEventListener('click', () => { setView(b.dataset.view); if (S.view === 'saved') renderSaved(); renderTabs(); window.scrollTo({ top: 0 }); }));

  /* ---------- boot ---------- */
  function boot() {
    $$('[data-ic]').forEach(el => { el.insertAdjacentHTML('afterbegin', ic(el.dataset.ic, 20)); });
    loadUi(); applyTheme(themePref);
    let list = loadLocal();
    if (!list || !list.length) {
      const ex = fromTemplate(TEMPLATES[0]); ex.title = 'Example class: Gentle hatha';
      list = [ex];
    }
    S.classes = list.map(x => cleanClass(x, x.id));
    if (!S.classes.find(c => c.id === S.curId)) S.curId = S.classes[0].id;
    saveLocal();
    renderAll();
    initCloud();
  }
  window.__yoga = { S, analyse, planText };
  boot();
})();

document.getElementById('ver').textContent = 'v' + APP_VERSION;
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(function () {});

</script>
